<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>DV Location</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0a0a0a;
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        gap: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
      }
      .status {
        font-size: 0.9rem;
        color: #888;
        text-align: center;
        line-height: 1.6;
      }
      .status.success {
        color: #56db23;
      }
      .status.error {
        color: #e24b4a;
      }
      .location-display {
        font-size: 1.1rem;
        font-weight: 500;
        color: #906cd2;
        text-align: center;
      }
      button {
        background: #906cd2;
        color: #fff;
        border: none;
        padding: 0.875rem 2rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        max-width: 280px;
        transition: opacity 0.2s ease;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .interval {
        font-size: 0.8rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>DV Location</h1>
    <div class="location-display" id="location-display">No location yet</div>
    <div class="status" id="status">
      Press start to begin sending location updates.
    </div>
    <button id="btn" onclick="toggle()">Start</button>
    <div class="interval">Updates every 60 minutes</div>

    <script>
      const API_URL = 'https://dv-agent.onrender.com';
      const SECRET = 'dvlocationsecret';
      const INTERVAL_MS = 60 * 60 * 1000;

      let intervalId = null;
      let running = false;

      function toggle() {
        if (running) {
          stop();
        } else {
          start();
        }
      }

      function start() {
        running = true;
        document.getElementById('btn').textContent = 'Stop';
        document.getElementById('status').textContent = 'Fetching location...';
        document.getElementById('status').className = 'status';
        sendLocation();
        intervalId = setInterval(sendLocation, INTERVAL_MS);
      }

      function stop() {
        running = false;
        clearInterval(intervalId);
        document.getElementById('btn').textContent = 'Start';
        document.getElementById('status').textContent = 'Stopped.';
        document.getElementById('status').className = 'status';
      }

      async function sendLocation() {
        if (!navigator.geolocation) {
          document.getElementById('status').textContent =
            'Geolocation not supported.';
          document.getElementById('status').className = 'status error';
          return;
        }

        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const { latitude, longitude } = pos.coords;

            // Reverse geocode to city using nominatim
            try {
              const geoRes = await fetch(
                `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`,
              );
              const geoData = await geoRes.json();
              const city =
                geoData.address.city ||
                geoData.address.town ||
                geoData.address.village ||
                geoData.address.state ||
                'Unknown';
              const country = geoData.address.country || 'Unknown';

              document.getElementById('location-display').textContent =
                `${city}, ${country}`;

              // Send to backend
              const res = await fetch(`${API_URL}/location`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-location-secret': SECRET,
                },
                body: JSON.stringify({ city, country }),
              });

              if (res.ok) {
                const now = new Date().toLocaleTimeString();
                document.getElementById('status').textContent =
                  `Last sent: ${now}`;
                document.getElementById('status').className = 'status success';
              } else {
                document.getElementById('status').textContent =
                  'Failed to send to backend.';
                document.getElementById('status').className = 'status error';
              }
            } catch (err) {
              document.getElementById('status').textContent =
                'Error getting location.';
              document.getElementById('status').className = 'status error';
            }
          },
          () => {
            document.getElementById('status').textContent =
              'Location permission denied.';
            document.getElementById('status').className = 'status error';
          },
        );
      }
    </script>
  </body>
</html>
